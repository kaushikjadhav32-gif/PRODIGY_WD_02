<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A beautiful and responsive stopwatch application">

    <meta name="theme-color" content="#6ab3c2">

    <title>Elegant Stopwatch</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Image -->
    <img src="background.png" class="bg-photo" alt="Nature background">

    <!-- Background Overlay -->
    <div class="background-overlay"></div>


    <!-- Main Page -->
    <div class="page">

        <!-- Header -->
        <header class="header">

            <div>
                <p class="eyebrow">
                    TIMEKEEPER
                </p>

                <h1>
                    Stopwatch
                </h1>

                <div class="title-line"></div>
            </div>

        </header>


        <!-- Main Stopwatch -->
        <main class="stopwatch-container">

            <!-- Stopwatch Dial -->
            <div class="dial-wrap">

                <svg class="dial" viewBox="0 0 400 400" role="img" aria-label="Stopwatch dial">

                    <!-- Main Circle -->
                    <circle class="dial-face" cx="200" cy="200" r="185"></circle>


                    <!-- Outer Ring -->
                    <circle class="outer-ring" cx="200" cy="200" r="176"></circle>


                    <!-- Clock Ticks -->
                    <g id="ticks"></g>


                    <!-- Stopwatch Hand -->
                    <line id="hand" class="hand" x1="200" y1="200" x2="200" y2="45"></line>


                    <!-- Center -->
                    <circle class="hand-cap-outer" cx="200" cy="200" r="9"></circle>

                    <circle class="hand-cap" cx="200" cy="200" r="5"></circle>

                </svg>


                <!-- Digital Display -->
                <div class="readout">

                    <div class="time">

                        <span id="display">
                            00:00
                        </span>

                        <span class="cs" id="centiseconds">
                            .00
                        </span>

                    </div>


                    <div class="status" id="status">
                        READY
                    </div>

                </div>

            </div>


            <!-- Controls -->
            <div class="controls">

                <button id="lapBtn" class="control-btn secondary" type="button" disabled>
                    LAP
                </button>


                <button id="startBtn" class="control-btn primary" type="button">
                    START
                </button>


                <button id="resetBtn" class="control-btn secondary" type="button">
                    RESET
                </button>

            </div>


            <!-- Keyboard Hint -->
            <div class="keyboard-hint">
                <span>SPACE</span> Start / Pause
                <span>L</span> Lap
                <span>R</span> Reset
            </div>


            <!-- Lap Panel -->
            <section class="laps">

                <div class="laps-header">

                    <span>
                        LAP
                    </span>

                    <span>
                        SPLIT
                    </span>

                    <span>
                        TOTAL
                    </span>

                </div>


                <div class="lap-list" id="lapList">

                    <div class="empty-laps">
                        Recorded laps will appear here
                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
